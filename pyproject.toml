[project]
name = "rul-pm"
version = "0.1.0"
description = "Remaining Useful Life prediction for turbofan engines (NASA C-MAPSS, simulated data)"
authors = [
    { email = "rudrakshacode348@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rul-pm = "rul_pm:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
